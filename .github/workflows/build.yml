name: build-binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: win32-x64
            sep: ";"
          - os: windows-11-arm
            artifact: win32-arm64
            sep: ";"
          - os: macos-13
            artifact: darwin-x64
            sep: ":"
          - os: macos-14
            artifact: darwin-arm64
            sep: ":"
          - os: ubuntu-latest
            artifact: linux-x64
            sep: ":"
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            sep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyinstaller
      - run: >
          python -m PyInstaller --onefile --name csp --paths src
          --add-data "src/code_standard_v2/data${{ matrix.sep }}code_standard_v2/data"
          --collect-submodules code_standard_v2
          packaging/entry.py
      - uses: actions/upload-artifact@v4
        with:
          name: csp-${{ matrix.artifact }}
          path: dist/csp*
